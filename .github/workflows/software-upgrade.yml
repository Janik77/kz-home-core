name: Supported software upgrade
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: software-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restart-backup-restore:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: core58
            core: cfe6ce70ed8e2f3392567ec27a807343d5e866bc
            web: 31dd1029173af6c7ff4ed4e9bf0c80679c185b3b
          - source: core56
            core: f2ec065426e72fb60b3e944ca6fd852bdffde48a
            web: 2ccf4172579563ad5e6cb1b0f4dba4147aada558
          - source: core54
            core: 2142dcd584f990031d0c02ed6b4c9f1a90d14eed
            web: 96c953f40f3a8eff464e2b57b5e7817456569206
          - source: core42
            core: 82653a849d2b61479de1c3bb4d74e7f388523667
            web: c2c4fa89a0da3652e8e0cca3629300ecfd7e658f
          - source: core52
            core: 244549d3cd6b5b2c5b7bc9757e438d2729553155
            web: 74b7238f10a9e56cbc600f9cac21b29a5c15b46e
          - source: core50
            core: c03aa044642e8e09bf61ff51c35a46079d1118f0
            web: 6f8f72f86f668b53f85c13054644c80427fe9eab
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Janik77/kz-home-web
          ref: 36515bdcb003e875108dd722febe5c969825f304
          path: web
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Janik77/kz-home-core
          ref: ${{ matrix.core }}
          path: core-before
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Janik77/kz-home-web
          ref: ${{ matrix.web }}
          path: web-before
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install checkout dependencies without system installation
        working-directory: web
        run: |
          python -m venv "$RUNNER_TEMP/durable-venv"
          "$RUNNER_TEMP/durable-venv/bin/python" -m pip install -r ../core/requirements-dev.txt
          "$RUNNER_TEMP/durable-venv/bin/python" -m pip check
          npm ci
          npm --prefix ../web-before ci
      - name: Pull fixed images before preservation baseline
        run: |
          docker pull postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
          docker pull eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
          docker pull alpine/openssl:latest@sha256:6821afa2476e11be343f29275f2ca24291720ff0a7148bd131fd8e314ff26d9e
      - name: Verify private persistence and isolated restore over real HTTP and MQTT TLS
        working-directory: core
        run: '"$RUNNER_TEMP/durable-venv/bin/python" -B tests/upgrade_software_acceptance.py ../web ../core-before ../web-before'

      - name: Source56/58 parked intent is invalidated only in upgraded copy
        if: matrix.source == 'core56' || matrix.source == 'core58'
        working-directory: core
        run: '"$RUNNER_TEMP/durable-venv/bin/python" -B tests/wait_profile_acceptance.py ../web ../core-before ../web-before'
