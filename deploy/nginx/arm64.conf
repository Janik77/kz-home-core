# Included in the image's http context. No request bodies, JWTs or query strings
# in access logs. Mount only the HTTPS leaf chain/key here, never a CA private key.
log_format kzhome_safe '$remote_addr $request_method $status $body_bytes_sent';
limit_req_zone $binary_remote_addr zone=kzhome_auth:1m rate=10r/m;

upstream kzhome_core {
    zone kzhome_core 64k;
    # NGINX >=1.27.3 supports runtime upstream DNS resolution in OSS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server core:8000 resolve;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    access_log /dev/stdout kzhome_safe;
    error_log /dev/stderr warn;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control "no-store" always;

    # Preserve bearer headers and real scheme. Never trust a supplied client IP.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_cache off;
    # A rotating refresh POST must never be replayed to an upstream.
    proxy_next_upstream off;

    location = /core-api { return 404; }
    # Browser WebSockets have no approved Authorization-header contract.
    location = /core-api/ws { return 404; }
    location /core-api/auth/ {
        limit_req zone=kzhome_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://kzhome_core/auth/;
    }
    location /core-api/ {
        proxy_pass http://kzhome_core/;
    }
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
