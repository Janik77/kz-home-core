persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 8883
protocol mqtt
allow_anonymous false
password_file /mosquitto/secrets/passwords
acl_file /mosquitto/config/acl
cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/server.crt
keyfile /mosquitto/secrets/server.key
tls_version tlsv1.2
# Server-authenticated TLS plus MQTT passwords; client certificates are not required.
require_certificate false
