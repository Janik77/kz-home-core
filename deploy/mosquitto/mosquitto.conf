persistence true
persistence_location /mosquitto/data/
log_dest stdout
user mosquitto

listener 8883
protocol mqtt
allow_anonymous false
password_file /run/mosquitto/passwords
acl_file /run/mosquitto/acl
cafile /run/mosquitto/ca.crt
certfile /run/mosquitto/server.crt
keyfile /run/mosquitto/server.key
tls_version tlsv1.2
# Server-authenticated TLS plus MQTT passwords; client certificates are not required.
require_certificate false
